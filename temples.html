<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A responsive temple album featuring temples from Nigeria, Africa, and around the world.">

    <meta name="author" content="Ewoh Benjamin Friday">

    <title>Temple Album | WDD 131</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>

<body>

    <header>
        <div class="header-content">
           <div class="header-content">
    <h2 class="site-title">Temple Album</h2>

    <button id="menu-button" class="menu-button" aria-label="Open navigation menu"

    <nav id="navigation">
        <a href="#old">Old</a>
<a href="#new">New</a>
<a href="#large">Large</a>

    <main>
        <h1>Temple Album</h1>

        <section class="temple-grid">

            <figure>

            </figure>

                    src="images/temple-aba.webp"

            </figure>

            <figure>

                    height="426">

            </figure>

            <figure>

                    src="images/temple-johannesburg.webp"

            <figure>
