<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for submitting a product rating, installation date, useful features, and written review.">
    <meta name="author" content="Ewoh Benjamin Friday">
    <title>Product Review Form | WDD 131</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <script src="../scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <h2>Product Review Form</h2>

            <p class="required-note">
                <span aria-hidden="true">*</span> Required field
            </p>

            <fieldset>
                <legend>Product Information</legend>

                <label for="product">
                    Product Name <span class="required" aria-hidden="true">*</span>
                </label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <p class="field-label">
                    Overall Rating <span class="required" aria-hidden="true">*</span>
                </p>

                <div class="rating-group">
                    <label for="rating-1">
                        <input type="radio" id="rating-1" name="rating" value="1" required>
                        <span>☆</span>
                        <span class="sr-only">1 star</span>
                    </label>

                    <label for="rating-2">
                        <input type="radio" id="rating-2" name="rating" value="2">
                        <span>☆☆</span>
                        <span class="sr-only">2 stars</span>
                    </label>

                    <label for="rating-3">
                        <input type="radio" id="rating-3" name="rating" value="3">
                        <span>☆☆☆</span>
                        <span class="sr-only">3 stars</span>
                    </label>

                    <label for="rating-4">
                        <input type="radio" id="rating-4" name="rating" value="4">
                        <span>☆☆☆☆</span>
                        <span class="sr-only">4 stars</span>
                    </label>

                    <label for="rating-5">
                        <input type="radio" id="rating-5" name="rating" value="5">
                        <span>☆☆☆☆☆</span>
                        <span class="sr-only">5 stars</span>
                    </label>
                </div>

                <label for="installDate">
                    Date of Installation <span class="required" aria-hidden="true">*</span>
                </label>

                <input type="date" id="installDate" name="installDate" required>
            </fieldset>

            <fieldset>
                <legend>Product Experience</legend>

                <p class="field-label">Useful Features</p>

                <div class="checkbox-group">
                    <label for="durability">
                        <input type="checkbox" id="durability" name="features" value="Durability">
                        Durability
                    </label>

                    <label for="ease">
                        <input type="checkbox" id="ease" name="features" value="Ease of Use">
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input type="checkbox" id="performance" name="features" value="Performance">
                        Performance
                    </label>

                    <label for="design">
                        <input type="checkbox" id="design" name="features" value="Design">
                        Design
                    </label>
                </div>

                <label for="review">
                    Written Review
                </label>

                <textarea id="review" name="review" rows="6" placeholder="Write your review here..."></textarea>
            </fieldset>

            <fieldset>
                <legend>Reviewer Information</legend>

                <label for="userName">
                    Your Name
                </label>

                <input type="text" id="userName" name="userName" autocomplete="name">
            </fieldset>

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Ewoh Benjamin Friday | Nigeria
        </p>

        <p id="lastModified"></p>
    </footer>
</body>
</html>
